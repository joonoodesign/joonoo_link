<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, viewport-fit=cover">
    <title>주누디자인 링크마스터 (대표 & 실장 전용)</title>
    
    <!-- PWA 모바일 설정 (가로/세로 자동회전 완벽 지원) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0B192C">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="주누링크">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <style>
        :root {
            --bg-color: #0c0d12;
            --container-bg: #14161f;
            --card-bg: #1c1f2b;
            --card-border: rgba(255, 255, 255, 0.15);
            --text-color: #ffffff;
            --text-muted: #a5acbd;
            --primary-gradient: linear-gradient(135deg, #0B192C 0%, #1E3E62 100%);
            --accent-gold: #FFD700;
            --accent-blue: #0A84FF;
            --button-shadow: rgba(0, 0, 0, 0.5);
            --border-color: #2f3445;
            --input-focus: rgba(255, 215, 0, 0.45);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 24px);
            --safe-left: env(safe-area-inset-left, 0px);
            --safe-right: env(safe-area-inset-right, 0px);
        }

        [data-theme="light"] {
            --bg-color: #f2f5fa;
            --container-bg: #ffffff;
            --card-bg: #ffffff;
            --card-border: #ccd3e2;
            --text-color: #111318;
            --text-muted: #555c6d;
            --primary-gradient: linear-gradient(135deg, #0B192C 0%, #1E3E62 100%);
            --button-shadow: rgba(0, 0, 0, 0.1);
            --border-color: #d6dce9;
            --input-focus: rgba(0, 122, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* ⭐ 핵심: 기본 폰트 크기 자체를 파격적으로 키움 (20px 기준) */
        html {
            font-size: 20px;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.25s ease, color 0.25s ease;
            margin: 0;
            padding: 0;
            padding-top: calc(var(--safe-top) + 12px);
            padding-bottom: calc(var(--safe-bottom) + 36px);
            padding-left: calc(var(--safe-left) + 14px);
            padding-right: calc(var(--safe-right) + 14px);
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 👑 큼직한 상단 헤더 배너 */
        .header-banner {
            background: var(--primary-gradient);
            color: white;
            padding: 18px 22px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 215, 0, 0.4);
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .header-banner h2 {
            margin: 0;
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vip-badge {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000000;
            font-size: 0.8rem;
            font-weight: 900;
            padding: 4px 10px;
            border-radius: 14px;
            letter-spacing: 0.5px;
        }

        .header-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.9);
            margin: 0;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .header-btn {
            background-color: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            color: white;
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            padding: 10px 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.95rem;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .header-btn:active {
            transform: scale(0.95);
            background-color: rgba(255, 255, 255, 0.4);
        }

        .header-btn.install-btn {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
            color: #000000;
            font-weight: 900;
            border: none;
            box-shadow: 0 4px 14px rgba(255, 215, 0, 0.5);
        }

        /* 🔍 시원하게 큰 검색창 */
        .toolbar {
            margin-bottom: 14px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            padding-right: 50px;
            border: 2px solid var(--border-color);
            border-radius: 18px;
            font-size: 1.2rem;
            font-weight: 700;
            font-family: inherit;
            background-color: var(--card-bg);
            color: var(--text-color);
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
            box-shadow: 0 4px 14px var(--button-shadow);
        }

        .search-input:focus {
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 4px var(--input-focus);
        }

        .search-clear {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: var(--text-color);
            font-size: 20px;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        /* 🏷️ 큼직한 카테고리 칩 */
        .category-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 14px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }

        .cat-chip {
            padding: 12px 18px;
            border-radius: 26px;
            font-size: 1.05rem;
            font-weight: 800;
            white-space: nowrap;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .cat-chip.active {
            background-color: var(--accent-gold);
            color: #000000;
            border-color: var(--accent-gold);
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.45);
        }

        /* ➕ 링크 추가 폼 */
        .add-form {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
            background-color: var(--card-bg);
            padding: 18px;
            border-radius: 20px;
            border: 2px solid var(--accent-gold);
            box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4);
        }

        body.edit-mode .add-form { display: flex; }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .add-form input, .add-form select {
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 14px;
            flex: 1;
            min-width: 180px;
            font-size: 1.1rem;
            font-family: inherit;
            background-color: var(--bg-color);
            color: var(--text-color);
            outline: none;
            box-sizing: border-box;
        }

        .btn-smart-fill {
            background-color: rgba(255, 215, 0, 0.2);
            color: var(--accent-gold);
            border: 2px solid var(--accent-gold);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-btn {
            background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            font-weight: 900;
            font-size: 1.2rem;
        }

        /* 📂 섹션 타이틀 (시원하고 큼직하게) */
        .section-title {
            font-size: 1.35rem;
            margin: 22px 0 12px 4px;
            color: var(--text-color);
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 📱 큼직한 버튼 그리드: 
           - 스마트폰 세로 모드: 넉넉한 1열 카드 (또는 화면 큰 폰 2열)
        */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }

        /* 화면 폭 420px 이상 또는 가로 모드일 때: 시원한 2~3열 */
        @media (min-width: 420px) {
            .button-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
        }

        /* 🔄 가로 회전 (Landscape) 모드: 3~4열로 쾌적하게 펼쳐짐 */
        @media screen and (orientation: landscape) {
            .button-grid {
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
                gap: 14px !important;
            }
            .link-btn {
                padding: 18px 50px 18px 18px !important;
                min-height: 80px !important;
            }
            .link-title {
                font-size: 1.25rem !important;
            }
        }

        .link-wrapper {
            position: relative;
            display: block;
        }

        /* 🔲 링크 카드: 돋보기 없이도 팍 띄는 대형 활자 */
        .link-btn {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-decoration: none;
            padding: 18px 50px 18px 18px;
            border-radius: 18px;
            font-weight: 900;
            border: 2px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-color);
            box-shadow: 0 4px 12px var(--button-shadow);
            transition: all 0.12s ease;
            min-height: 74px;
            word-break: keep-all;
            overflow: hidden;
        }

        .link-btn:active {
            transform: scale(0.97);
            filter: brightness(1.25);
            border-color: var(--accent-gold);
        }

        /* ⭐ 상호명 초대형 폰트 (1.28rem = 약 26px) */
        .link-title {
            display: block;
            width: 100%;
            font-size: 1.28rem;
            font-weight: 900;
            line-height: 1.35;
            letter-spacing: -0.4px;
            white-space: normal;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .link-url-preview {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-top: 5px;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        /* 📋 큼직한 복사 버튼 */
        .copy-btn {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.14);
            color: var(--text-muted);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .copy-btn:active {
            transform: translateY(-50%) scale(0.9);
            background: var(--accent-gold);
            color: #000000;
        }

        .delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ff3b30;
            color: white;
            border: 2px solid var(--container-bg);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 15px;
            z-index: 10;
        }

        body.edit-mode .delete-btn { display: flex; }

        /* 카테고리별 테마 테두리 (6px 두께로 선명) */
        .cat-top { border-left: 6px solid #FFD700 !important; }
        .cat-partner { border-left: 6px solid #34C759 !important; }
        .cat-design { border-left: 6px solid #AF52DE !important; }
        .cat-frequent { border-left: 6px solid #0A84FF !important; }

        .loading-spinner {
            text-align: center;
            color: var(--text-muted);
            font-weight: 800;
            padding: 36px;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        .bottom-bar {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            color: var(--text-muted);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 👑 상단 헤더 -->
        <div class="header-banner">
            <div class="header-title-box">
                <h2>👑 주누링크 <span class="vip-badge">VIP</span></h2>
                <p class="header-subtitle">주누디자인 대표 & 실장 전용</p>
            </div>
            <div class="header-actions">
                <button id="btnInstall" class="header-btn install-btn" style="display:none;" onclick="installApp()">📲 앱 설치</button>
                <button id="btnEditMode" class="header-btn" onclick="toggleEditMode()">편집 🔒</button>
                <button id="btnTheme" class="header-btn" onclick="toggleTheme()">☀️</button>
            </div>
        </div>

        <!-- 🔍 시원하고 큰 검색창 -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 링크 이름 검색..." oninput="handleSearch(this.value)">
                <button id="searchClear" class="search-clear" onclick="clearSearch()">✕</button>
            </div>
        </div>

        <!-- 🏷️ 큼직한 카테고리 칩 -->
        <div class="category-nav">
            <div class="cat-chip active" onclick="filterCategory('all', this)">전체보기</div>
            <div class="cat-chip" onclick="filterCategory('top', this)">🌟 최상단 즐겨찾기</div>
            <div class="cat-chip" onclick="filterCategory('partner', this)">🏭 인쇄·협력업체</div>
            <div class="cat-chip" onclick="filterCategory('design', this)">🎨 디자인·AI소스</div>
            <div class="cat-chip" onclick="filterCategory('frequent', this)">⚡ 마켓·어드민</div>
        </div>

        <!-- ➕ 링크 추가 폼 -->
        <div class="add-form" id="addForm">
            <div class="form-row">
                <input type="text" id="inputName" placeholder="버튼 이름 (예: 성원애드피아)">
                <select id="inputCategory">
                    <option value="top">🌟 최상단 즐겨찾기</option>
                    <option value="partner">🏭 인쇄·협력업체</option>
                    <option value="design">🎨 디자인·AI소스</option>
                    <option value="frequent">⚡ 마켓·어드민</option>
                </select>
            </div>
            <div class="form-row">
                <input type="url" id="inputUrl" placeholder="링크 주소 (https://...)" onchange="smartSuggestName(this.value)">
                <button type="button" class="btn-smart-fill" onclick="smartSuggestName(document.getElementById('inputUrl').value)">🤖 자동완성</button>
            </div>
            <button id="btnAdd" class="add-btn" onclick="addLink()">새 링크 등록 ➕</button>
        </div>

        <!-- 4대 카테고리 목록 -->
        <div id="section-top" class="cat-section">
            <div class="section-title">🌟 최상단 즐겨찾기</div>
            <div class="button-grid" id="grid-top">
                <div class="loading-spinner">링크를 불러오는 중입니다...</div>
            </div>
        </div>

        <div id="section-partner" class="cat-section">
            <div class="section-title">🏭 인쇄·협력업체</div>
            <div class="button-grid" id="grid-partner"></div>
        </div>

        <div id="section-design" class="cat-section">
            <div class="section-title">🎨 디자인·AI소스</div>
            <div class="button-grid" id="grid-design"></div>
        </div>

        <div id="section-frequent" class="cat-section">
            <div class="section-title">⚡ 마켓·어드민 & 기타</div>
            <div class="button-grid" id="grid-frequent"></div>
        </div>

        <div class="bottom-bar">
            <span>주누디자인 대표 & 실장 전용 • 가로세로 자동회전</span>
            <span id="linkCount">0개 연결됨</span>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzkU-D5m1R_JIypP3D6S0OqxOo1ICn3wXkE4b0VAoqIT-Yx2EA_Uru3F4blDlIBVnSd/exec";
        const VALID_CATEGORIES = new Set(["top", "partner", "design", "frequent"]);
        let links = [];
        let currentFilter = 'all';
        let deferredPrompt = null;

        // PWA 서비스워커 등록 및 최신화
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js?v=3').then(reg => {
                    reg.update();
                }).catch(() => {});
            });
        }

        // PWA 설치 감지
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('btnInstall');
            if (btn) btn.style.display = 'inline-flex';
        });

        async function installApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                document.getElementById('btnInstall').style.display = 'none';
            }
            deferredPrompt = null;
        }

        // 갤럭시 햅틱 진동 피드백
        function triggerHaptic(duration = 20) {
            if (navigator.vibrate) {
                try { navigator.vibrate(duration); } catch (_) {}
            }
        }

        function sanitizeUrl(raw) {
            try {
                const candidate = String(raw).trim();
                const parsed = new URL(candidate);
                if (parsed.protocol === "http:" || parsed.protocol === "https:") {
                    return parsed.href;
                }
            } catch (_) {}
            return null;
        }

        // 스마트 도메인 분석 자동완성
        function smartSuggestName(urlStr) {
            if (!urlStr) return;
            const safe = sanitizeUrl(urlStr);
            if (!safe) return;
            const nameInput = document.getElementById("inputName");
            const catSelect = document.getElementById("inputCategory");
            
            try {
                const host = new URL(safe).hostname.toLowerCase();
                if (host.includes("swadpia")) { nameInput.value = "성원애드피아"; catSelect.value = "partner"; }
                else if (host.includes("eprint")) { nameInput.value = "이프린트"; catSelect.value = "partner"; }
                else if (host.includes("cafe24")) { nameInput.value = "카페24 관리자"; catSelect.value = "frequent"; }
                else if (host.includes("smartstore")) { nameInput.value = "스마트스토어"; catSelect.value = "frequent"; }
                else if (host.includes("coupang")) { nameInput.value = "쿠팡 윙"; catSelect.value = "frequent"; }
                else if (host.includes("esmplus")) { nameInput.value = "ESM Plus"; catSelect.value = "frequent"; }
                else if (host.includes("11st")) { nameInput.value = "11번가 셀러오피스"; catSelect.value = "frequent"; }
                else if (host.includes("freepik")) { nameInput.value = "프리픽"; catSelect.value = "design"; }
                else if (host.includes("flaticon")) { nameInput.value = "플랫아이콘"; catSelect.value = "design"; }
                else if (!nameInput.value) {
                    nameInput.value = host.replace("www.", "").split(".")[0].toUpperCase();
                }
                triggerHaptic(15);
            } catch (_) {}
        }

        async function fetchLinks() {
            const cached = localStorage.getItem("joonoo_links_cache");
            if (cached) {
                try {
                    links = JSON.parse(cached);
                    renderLinks();
                } catch (_) {}
            }

            try {
                const response = await fetch(SCRIPT_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (Array.isArray(data)) {
                    links = data;
                    localStorage.setItem("joonoo_links_cache", JSON.stringify(data));
                    renderLinks();
                }
            } catch (error) {
                if (!links.length) {
                    document.getElementById("grid-top").innerHTML = "<div class='loading-spinner'>연결에 실패했습니다. 화면을 당겨 새로고침해 주세요.</div>";
                }
            }
        }

        function renderLinks() {
            const query = (document.getElementById("searchInput").value || "").trim().toLowerCase();
            VALID_CATEGORIES.forEach(cat => {
                const el = document.getElementById(`grid-${cat}`);
                if (el) el.textContent = "";
            });

            let visibleCount = 0;

            links.forEach(link => {
                const safeUrl = sanitizeUrl(String(link.url || ""));
                if (!safeUrl) return;
                const nameStr = String(link.name || safeUrl);
                
                if (query && !nameStr.toLowerCase().includes(query) && !safeUrl.toLowerCase().includes(query)) {
                    return;
                }

                const cat = VALID_CATEGORIES.has(link.category) ? link.category : "frequent";
                if (currentFilter !== 'all' && currentFilter !== cat) {
                    return;
                }

                const grid = document.getElementById(`grid-${cat}`);
                if (!grid) return;

                visibleCount++;

                const wrapper = document.createElement("div");
                wrapper.className = "link-wrapper";

                const anchor = document.createElement("a");
                anchor.href = safeUrl;
                anchor.target = "_blank";
                anchor.rel = "noopener noreferrer";
                anchor.className = `link-btn cat-${cat}`;
                anchor.addEventListener("click", () => triggerHaptic(20));

                const titleSpan = document.createElement("span");
                titleSpan.className = "link-title";
                titleSpan.textContent = nameStr;
                anchor.appendChild(titleSpan);

                const urlPreview = document.createElement("span");
                urlPreview.className = "link-url-preview";
                try {
                    urlPreview.textContent = new URL(safeUrl).hostname.replace("www.", "");
                } catch (_) {
                    urlPreview.textContent = safeUrl;
                }
                anchor.appendChild(urlPreview);

                const copyBtn = document.createElement("button");
                copyBtn.type = "button";
                copyBtn.className = "copy-btn";
                copyBtn.title = "링크 복사";
                copyBtn.textContent = "📋";
                copyBtn.addEventListener("click", async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    triggerHaptic(30);
                    try {
                        await navigator.clipboard.writeText(safeUrl);
                        copyBtn.textContent = "✓";
                        copyBtn.style.color = "#FFD700";
                        setTimeout(() => {
                            copyBtn.textContent = "📋";
                            copyBtn.style.color = "";
                        }, 1200);
                    } catch (_) {
                        prompt("아래 주소를 복사하세요:", safeUrl);
                    }
                });

                const delBtn = document.createElement("button");
                delBtn.type = "button";
                delBtn.className = "delete-btn";
                delBtn.title = "삭제";
                delBtn.textContent = "×";
                delBtn.addEventListener("click", (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    deleteLink(link.id);
                });

                wrapper.appendChild(anchor);
                wrapper.appendChild(copyBtn);
                wrapper.appendChild(delBtn);
                grid.appendChild(wrapper);
            });

            VALID_CATEGORIES.forEach(cat => {
                const sec = document.getElementById(`section-${cat}`);
                const grid = document.getElementById(`grid-${cat}`);
                if (sec && grid) {
                    if (currentFilter !== 'all' && currentFilter !== cat) {
                        sec.style.display = 'none';
                    } else if (grid.children.length === 0 && query) {
                        sec.style.display = 'none';
                    } else {
                        sec.style.display = 'block';
                    }
                }
            });

            document.getElementById("linkCount").textContent = `${visibleCount}개 연결됨`;
        }

        function handleSearch(val) {
            document.getElementById("searchClear").style.display = val ? "flex" : "none";
            renderLinks();
        }

        function clearSearch() {
            const input = document.getElementById("searchInput");
            input.value = "";
            document.getElementById("searchClear").style.display = "none";
            renderLinks();
        }

        function filterCategory(cat, chipEl) {
            triggerHaptic(15);
            currentFilter = cat;
            document.querySelectorAll(".cat-chip").forEach(c => c.classList.remove("active"));
            chipEl.classList.add("active");
            renderLinks();
        }

        async function addLink() {
            const category = document.getElementById("inputCategory").value;
            const name = document.getElementById("inputName").value.trim();
            const rawUrl = document.getElementById("inputUrl").value.trim();
            const btnAdd = document.getElementById("btnAdd");

            if (!name || !rawUrl) return alert("이름과 링크 주소를 모두 입력해주세요!");
            const safeUrl = sanitizeUrl(rawUrl);
            if (!safeUrl) return alert("올바른 http:// 또는 https:// 주소를 입력해주세요!");

            triggerHaptic(25);
            btnAdd.textContent = "저장 중...";
            btnAdd.disabled = true;

            const newLink = {
                action: "add",
                id: Date.now().toString(),
                name,
                url: safeUrl,
                category: VALID_CATEGORIES.has(category) ? category : "frequent"
            };

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify(newLink),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                links.push(newLink);
                localStorage.setItem("joonoo_links_cache", JSON.stringify(links));
                renderLinks();
                document.getElementById("inputName").value = "";
                document.getElementById("inputUrl").value = "";
            } catch (error) {
                alert("추가 중 오류가 발생했습니다.");
            } finally {
                btnAdd.textContent = "새 링크 등록 ➕";
                btnAdd.disabled = false;
            }
        }

        async function deleteLink(id) {
            if (!confirm("이 링크를 삭제하시겠습니까?")) return;
            triggerHaptic(40);
            try {
                const res = await fetch(SCRIPT_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "delete", id: String(id) }),
                    headers: { "Content-Type": "text/plain;charset=utf-8" }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                links = links.filter(link => String(link.id) !== String(id));
                localStorage.setItem("joonoo_links_cache", JSON.stringify(links));
                renderLinks();
            } catch (error) {
                alert("삭제 중 오류가 발생했습니다.");
            }
        }

        function toggleEditMode() {
            triggerHaptic(20);
            const isEdit = document.body.classList.toggle("edit-mode");
            const btn = document.getElementById("btnEditMode");
            btn.textContent = isEdit ? "완료 🔓" : "편집 🔒";
            btn.style.color = isEdit ? "#FFD700" : "";
        }

        function toggleTheme() {
            triggerHaptic(15);
            const body = document.body;
            const btn = document.getElementById("btnTheme");
            if (body.getAttribute("data-theme") === "light") {
                body.removeAttribute("data-theme");
                btn.textContent = "☀️";
                localStorage.setItem("junu_vip_theme", "dark");
            } else {
                body.setAttribute("data-theme", "light");
                btn.textContent = "🌙";
                localStorage.setItem("junu_vip_theme", "light");
            }
        }

        // 화면 회전 감지 시 즉시 레이아웃 재계산
        window.addEventListener('orientationchange', () => {
            setTimeout(() => { renderLinks(); }, 150);
        });
        window.addEventListener('resize', () => {
            renderLinks();
        });

        window.onload = () => {
            if (localStorage.getItem("junu_vip_theme") === "light") {
                document.body.setAttribute("data-theme", "light");
                document.getElementById("btnTheme").textContent = "🌙";
            }
            fetchLinks();
        };
    </script>
</body>
</html>
